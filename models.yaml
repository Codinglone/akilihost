models:
  - repo_id: Qwen/Qwen3-Coder-Next
    name: Qwen3-Coder-Next
    description: "Qwen's latest large code model with MoE architecture"
    architecture: moe
    total_params: "80B"
    active_params: "~40B"
    context_tokens: 131072
    license: "Apache 2.0"
    benchmarks:
      HumanEval: 91.3
      SWE-bench: 55.4
      LiveBench: 67.2
    quantizations:
      - name: FP8
        description: "Dynamic FP8 quantization (fastest, ~75GB VRAM)"
        dtype: bfloat16
        quant_mode: fp8
        min_vram_mb: 75000
        flags:
          - "--dtype"
          - "bfloat16"
          - "--quantization"
          - "fp8"

  - repo_id: Qwen/Qwen2.5-Coder-32B-Instruct
    name: Qwen2.5-Coder-32B
    description: "Strong coding performance, efficient 32B model"
    architecture: dense
    total_params: "32B"
    active_params: "32B"
    context_tokens: 131072
    license: "Apache 2.0"
    benchmarks:
      HumanEval: 92.7
      SWE-bench: 51.4
      LiveBench: 64.8
    quantizations:
      - name: BF16
        description: "Native precision (best quality, ~64GB VRAM)"
        dtype: bfloat16
        quant_mode: none
        min_vram_mb: 64000
        flags:
          - "--dtype"
          - "bfloat16"

  - repo_id: mistralai/Devstral-2-123B-Instruct-2512
    name: Devstral 2 123B
    description: "Mistral's powerful reasoning model"
    architecture: dense
    total_params: "123B"
    active_params: "123B"
    context_tokens: 131072
    license: "Apache 2.0"
    benchmarks:
      HumanEval: 86.5
      SWE-bench: 58.2
      LiveBench: 71.3
    quantizations:
      - name: FP8
        description: "Dynamic FP8 (good quality, ~119GB VRAM)"
        dtype: bfloat16
        quant_mode: fp8
        min_vram_mb: 119000
        flags:
          - "--dtype"
          - "bfloat16"
          - "--quantization"
          - "fp8"
